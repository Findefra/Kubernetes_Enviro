apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidecar-demo
  labels:
    app: sidecar-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sidecar-demo
  template:
    metadata:
      labels:
        app: sidecar-demo
    spec:
      containers:
      # Main application container
      - name: app
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: shared-logs
          mountPath: /var/log/nginx
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "64Mi"

      # Sidecar: tails logs and "ships" them (demo prints to stdout)
      - name: log-shipper
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - |
          echo "Log shipper started"
          tail -F /var/log/nginx/access.log 2>/dev/null || \
          while true; do
            echo "$(date) - shipping logs... (demo)"
            sleep 15
          done
        volumeMounts:
        - name: shared-logs
          mountPath: /var/log/nginx
          readOnly: true
        resources:
          requests:
            cpu: "25m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "32Mi"

      volumes:
      - name: shared-logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sidecar-demo
  labels:
    app: sidecar-demo
spec:
  selector:
    app: sidecar-demo
  ports:
  - port: 80
    targetPort: 80
