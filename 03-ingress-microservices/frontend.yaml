apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    project: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        project: microservices
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "64Mi"
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: frontend-html
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
    project: microservices
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  labels:
    project: microservices
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Frontend</title></head>
    <body style="font-family: system-ui; max-width: 600px; margin: 3rem auto;">
      <h1>Frontend Service</h1>
      <p>This is the public-facing frontend.</p>
      <p><a href="/api">Call Backend API →</a></p>
    </body>
    </html>
