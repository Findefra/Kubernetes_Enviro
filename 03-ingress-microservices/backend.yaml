apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    project: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        project: microservices
    spec:
      containers:
      - name: http-echo
        image: hashicorp/http-echo:1.0
        args:
        - "-text=Hello from Backend API (Kubernetes POC #03)"
        - "-listen=:8080"
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "150m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
    project: microservices
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 8080
