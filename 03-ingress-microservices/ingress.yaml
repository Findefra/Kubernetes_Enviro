apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices
  labels:
    project: microservices
  annotations:
    # Common annotations – adjust for your controller
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # kubernetes.io/ingress.class: nginx
spec:
  # ingressClassName: nginx          # preferred over annotation in modern clusters
  # Uncomment the tls block after creating a real secret:
  # tls:
  # - hosts:
  #   - demo.local
  #   secretName: tls-secret
  rules:
  - host: demo.local                 # change to your domain or remove host for IP-based
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
# To add TLS later:
# openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   -keyout tls.key -out tls.crt -subj "/CN=demo.local"
# kubectl create secret tls tls-secret --cert=tls.crt --key=tls.key -n default
