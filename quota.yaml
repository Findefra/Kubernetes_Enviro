apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-a-quota
  namespace: team-a
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    services: "10"
    persistentvolumeclaims: "5"
    secrets: "20"
    configmaps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: team-a-limits
  namespace: team-a
spec:
  limits:
  # Default values applied when a container omits requests/limits
  - default:                 # limits
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:          # requests
      cpu: "100m"
      memory: "128Mi"
    max:                     # hard max per container
      cpu: "2"
      memory: "2Gi"
    min:                     # hard min per container
      cpu: "50m"
      memory: "32Mi"
    type: Container
  # Also constrain PVCs
  - max:
      storage: 50Gi
    min:
      storage: 1Gi
    type: PersistentVolumeClaim
