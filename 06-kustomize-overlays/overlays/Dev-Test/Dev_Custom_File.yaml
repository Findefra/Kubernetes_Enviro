apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
- ../../base

namePrefix: dev-

replicas:
- name: api
  count: 2

images:
- name: nginx
  newName: nginx
  newTag: 1.25-alpine

patches:
- target:
    kind: Deployment
    name: api
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "25m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "100m"
