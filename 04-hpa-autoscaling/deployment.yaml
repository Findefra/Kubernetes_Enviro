apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels:
    app: loadgen
spec:
  replicas: 4
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
      - name: php-apache
        # Classic HPA demo image that burns CPU on requests
        image: registry.k8s.io/hpa-example
        ports:
        - containerPort: 80
        resources:
          # Requests are REQUIRED for HPA to calculate utilization %
          requests:
            cpu: "200m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: loadgen
  labels:
    app: loadgen
spec:
  selector:
    app: loadgen
  ports:
  - port: 80
    targetPort: 80
